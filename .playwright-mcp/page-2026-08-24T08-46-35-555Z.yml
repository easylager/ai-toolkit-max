          - generic [ref=f10e67]: AC-001
          - generic [ref=f10e68]: "A task can have a persisted Design state (`NOT_STARTED`/`IN_PROGRESS`/`READY_FOR_REVIEW`/`APPROVED`) that survives terminal close, Claude restart, `/reconcile`, and UI reload — derived from the authoritative Task Context, never stored only in frontend memory."
          - generic [ref=f10e69]: VERIFIED
        - listitem [ref=f10e70]:
          - generic [ref=f10e71]: ✓
          - generic [ref=f10e72]: AC-002
          - generic [ref=f10e73]: A task can reference a generated Design Artifact with stable identifier, task identifier, title, description, status, entrypoint/path, and creation/update info — authoritative metadata on disk, recoverable without the UI process alive. No new database if the filesystem/Task Context architecture is sufficient.
          - generic [ref=f10e74]: VERIFIED
        - listitem [ref=f10e75]:
          - generic [ref=f10e76]: ✓
          - generic [ref=f10e77]: AC-003
          - generic [ref=f10e78]: At least one task produces a real, browser-renderable, genuinely interactive prototype (animated transition, interactive navigation, hover/motion state, scroll-driven animation, or dynamic content/state) — not a static screenshot or static HTML mockup. Uses AI Studio's existing frontend technology unless a compelling reason exists otherwise.
          - generic [ref=f10e79]: VERIFIED
        - listitem [ref=f10e80]:
          - generic [ref=f10e81]: ✓
          - generic [ref=f10e82]: AC-004
          - generic [ref=f10e83]: "The prototype demonstrates several of: strong visual hierarchy, deliberate typography, responsive layout, meaningful animation, polished transitions, high-quality imagery/assets, cinematic/scroll-driven interaction where appropriate, layered visual composition. No 3D merely for the sake of having 3D. Architecture leaves room for a future Design Agent choosing between techniques based on the actual design problem."
          - generic [ref=f10e84]: VERIFIED
        - listitem [ref=f10e85]:
          - generic [ref=f10e86]: ✓
          - generic [ref=f10e87]: AC-005
          - generic [ref=f10e88]: "The AI Studio UI exposes the prototype from its task: open a task → see design status → open the Design/Prototype view → interact with the prototype → return to the task without losing state. Rendered in an isolated preview surface (iframe or equivalent). Does not replace the existing task UI."
