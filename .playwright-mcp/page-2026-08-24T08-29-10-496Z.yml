          - generic [ref=f7e65]: AC-001
          - generic [ref=f7e66]: "A task can have a persisted Design state (`NOT_STARTED`/`IN_PROGRESS`/`READY_FOR_REVIEW`/`APPROVED`) that survives terminal close, Claude restart, `/reconcile`, and UI reload — derived from the authoritative Task Context, never stored only in frontend memory."
          - generic [ref=f7e67]: NOT_VERIFIED
        - listitem [ref=f7e68]:
          - generic [ref=f7e69]: ✓
          - generic [ref=f7e70]: AC-002
          - generic [ref=f7e71]: A task can reference a generated Design Artifact with stable identifier, task identifier, title, description, status, entrypoint/path, and creation/update info — authoritative metadata on disk, recoverable without the UI process alive. No new database if the filesystem/Task Context architecture is sufficient.
          - generic [ref=f7e72]: VERIFIED
        - listitem [ref=f7e73]:
          - generic [ref=f7e74]: ✓
          - generic [ref=f7e75]: AC-003
          - generic [ref=f7e76]: At least one task produces a real, browser-renderable, genuinely interactive prototype (animated transition, interactive navigation, hover/motion state, scroll-driven animation, or dynamic content/state) — not a static screenshot or static HTML mockup. Uses AI Studio's existing frontend technology unless a compelling reason exists otherwise.
          - generic [ref=f7e77]: VERIFIED
        - listitem [ref=f7e78]:
          - generic [ref=f7e79]: ✓
          - generic [ref=f7e80]: AC-004
          - generic [ref=f7e81]: "The prototype demonstrates several of: strong visual hierarchy, deliberate typography, responsive layout, meaningful animation, polished transitions, high-quality imagery/assets, cinematic/scroll-driven interaction where appropriate, layered visual composition. No 3D merely for the sake of having 3D. Architecture leaves room for a future Design Agent choosing between techniques based on the actual design problem."
          - generic [ref=f7e82]: VERIFIED
        - listitem [ref=f7e83]:
          - generic [ref=f7e84]: ○
          - generic [ref=f7e85]: AC-005
          - generic [ref=f7e86]: "The AI Studio UI exposes the prototype from its task: open a task → see design status → open the Design/Prototype view → interact with the prototype → return to the task without losing state. Rendered in an isolated preview surface (iframe or equivalent). Does not replace the existing task UI."
